# Optional drop-in: let graywatchd read FUSE request counts.
#
# /sys/fs/fuse/connections/<id>/waiting is readable by root only, so the
# unprivileged daemon reports FUSE mounts as "unavailable". CAP_DAC_READ_SEARCH
# lets it read files regardless of their permission bits; it grants no write
# access and nothing else. Install with:
#
#   sudo install -D -m 0644 graywatchd-fuse.conf \
#       /etc/systemd/system/graywatchd.service.d/fuse.conf
#   sudo systemctl daemon-reload && sudo systemctl restart graywatchd
[Service]
AmbientCapabilities=CAP_DAC_READ_SEARCH
CapabilityBoundingSet=CAP_DAC_READ_SEARCH
